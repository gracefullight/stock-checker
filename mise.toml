monorepo_root = true

[settings]
experimental = true
task.auto_infer = ["node"]

[monorepo]
config_roots = ["apps/*", "packages/*"]

[monorepo.task_defaults.build]
depends = ["^build"]

[tools]
node = "26"
bun = "1.4.2"
python = "3.14"
uv = "0.12.22"

# ── Install ──────────────────────────────────────────────────
[tasks.install]
description = "Install all dependencies"
run = "bun install"

[tasks."install:ci"]
description = "Install workspace dependencies without changing the lockfile"
run = "bun install --frozen-lockfile"

[tasks."deps:outdated"]
description = "Check outdated dependencies across all workspaces"
run = "bun outdated --recursive --no-cache"

[tasks."deps:update"]
description = "Update dependencies across all workspaces to the latest versions"
run = "bun update --filter '*' --filter './' --latest --no-cache"

# ── Python finance tools ──────────────────────────────────────
[tasks."finance:install"]
description = "Install the locked Python finance-tool dependencies"
run = "uv sync --project packages/finance --locked --python 3.14"

[tasks."finance:deps:outdated"]
description = "Check outdated packages in the Python finance environment"
depends = ["finance:install"]
run = "uv pip list --python packages/finance/.venv/bin/python --outdated"

[tasks."finance:deps:update"]
description = "Update and install the Python finance dependency lockfile"
run = """
set -eu
uv lock --project packages/finance --upgrade
uv sync --project packages/finance --locked --python 3.14
"""

[tasks."finance:run"]
description = "Run a Python finance script with the locked environment"
env.PYTHONDONTWRITEBYTECODE = "1"
run = 'uv run --project packages/finance --locked --python 3.14 python "$@"'

[tasks."finance:typecheck"]
description = "Type-check the Python financial analysis scripts with Pyrefly"
run = "uv run --project packages/finance --locked --python 3.14 pyrefly check --config packages/finance/pyproject.toml --min-severity warn"

[tasks."finance:lint"]
description = "Lint the Python finance scripts and tests with Ruff"
run = "uv run --project packages/finance --locked --python 3.14 ruff check --config packages/finance/pyproject.toml .agents/skills/stock-analysis/scripts .agents/skills/backtesting-trading-strategies/scripts packages/finance/tests"

[tasks."finance:lint:fix"]
description = "Apply safe Ruff fixes to the Python finance scripts and tests"
run = "uv run --project packages/finance --locked --python 3.14 ruff check --fix --config packages/finance/pyproject.toml .agents/skills/stock-analysis/scripts .agents/skills/backtesting-trading-strategies/scripts packages/finance/tests"

[tasks."finance:format:check"]
description = "Check Python finance formatting with Ruff"
run = "uv run --project packages/finance --locked --python 3.14 ruff format --check --output-format concise --config packages/finance/pyproject.toml .agents/skills/stock-analysis/scripts .agents/skills/backtesting-trading-strategies/scripts packages/finance/tests"

[tasks."finance:format"]
description = "Format the Python finance scripts and tests with Ruff"
run = "uv run --project packages/finance --locked --python 3.14 ruff format --config packages/finance/pyproject.toml .agents/skills/stock-analysis/scripts .agents/skills/backtesting-trading-strategies/scripts packages/finance/tests"

[tasks."finance:fix"]
description = "Fix Python lint and formatting sequentially"
run = """
set -eu
mise run finance:lint:fix
mise run finance:format
"""

[tasks."finance:test"]
description = "Run Python finance regression tests"
env.PYTHONDONTWRITEBYTECODE = "1"
run = "uv run --project packages/finance --locked --python 3.14 pytest packages/finance/tests"

# ── Dev Servers ──────────────────────────────────────────────
[tasks.mcp]
description = "Run the local Stock Checker MCP server over stdio"
raw = true
run = "bun apps/mcp/src/index.ts"

[tasks."whatsapp:link"]
description = "Link WhatsApp Web by scanning the local gateway QR code"
raw = true
run = "node packages/core/src/whatsapp/index.ts --link"

[tasks."whatsapp:gateway"]
description = "Run the local WhatsApp Web notification gateway"
raw = true
run = "node packages/core/src/whatsapp/index.ts"

[tasks."whatsapp:service:install"]
description = "Install the macOS WhatsApp user service (add --link for initial QR pairing)"
raw = true
run = 'node --import tsx packages/automation/services/launchd.mts install whatsapp "$@"'

[tasks."whatsapp:service:start"]
description = "Start the installed macOS WhatsApp user service"
raw = true
run = "node --import tsx packages/automation/services/launchd.mts start whatsapp"

[tasks."whatsapp:service:restart"]
description = "Restart the owned macOS WhatsApp service and renew pending QR pairing"
raw = true
run = "node --import tsx packages/automation/services/launchd.mts restart whatsapp"

[tasks."whatsapp:service:stop"]
description = "Stop the macOS WhatsApp user service"
raw = true
run = "node --import tsx packages/automation/services/launchd.mts stop whatsapp"

[tasks."whatsapp:service:status"]
description = "Inspect the installed macOS WhatsApp user service"
raw = true
run = "node --import tsx packages/automation/services/launchd.mts status whatsapp"

[tasks."whatsapp:service:uninstall"]
description = "Remove the macOS WhatsApp user service while preserving linked sessions"
raw = true
run = "node --import tsx packages/automation/services/launchd.mts uninstall whatsapp"

[tasks."daily-report"]
description = "Run the Sydney 09:00 Finviz-first report; --dry-run and --status perform no scan or send"
dir = "packages/core"
raw = true
run = 'bun src/commands/daily-report.ts "$@"'

[tasks."daily-report:service:install"]
description = "Install the macOS Sydney morning screening trigger"
raw = true
run = "node --import tsx packages/automation/services/launchd.mts install daily-report"

[tasks."daily-report:service:start"]
description = "Enable the installed Sydney morning screening trigger"
raw = true
run = "node --import tsx packages/automation/services/launchd.mts start daily-report"

[tasks."daily-report:service:restart"]
description = "Restart the owned morning trigger without bypassing its daily claim or time window"
raw = true
run = "node --import tsx packages/automation/services/launchd.mts restart daily-report"

[tasks."daily-report:service:stop"]
description = "Disable the Sydney morning screening trigger across login"
raw = true
run = "node --import tsx packages/automation/services/launchd.mts stop daily-report"

[tasks."daily-report:service:status"]
description = "Inspect the installed Sydney morning screening trigger"
raw = true
run = "node --import tsx packages/automation/services/launchd.mts status daily-report"

[tasks."daily-report:service:uninstall"]
description = "Remove the morning trigger while preserving reports and WhatsApp sessions"
raw = true
run = "node --import tsx packages/automation/services/launchd.mts uninstall daily-report"

[tasks."dev:api"]
description = "Start Fastify API server (port 5101)"
run = 'mise run //apps/api:dev "$@"'

[tasks."dev:web"]
description = "Start Next.js dev server (port 5100)"
run = 'mise run //apps/web:dev "$@"'

[tasks.dev]
description = "Start API + Web dev servers in parallel"
depends = ["//apps/api:dev", "//apps/web:dev"]

# ── Build ─────────────────────────────────────────────────────
[tasks."build:core"]
run = 'mise run //packages/core:build "$@"'

[tasks."build:api"]
run = 'mise run //apps/api:build "$@"'

[tasks."build:web"]
run = 'mise run //apps/web:build "$@"'

[tasks.build]
description = "Build all apps"
depends = ["//apps/api:build", "//apps/web:build"]

# ── Quality ───────────────────────────────────────────────────
[tasks."release:test"]
description = "Test release PR validation, lockfile synchronization, and merge guards"
run = "node --import tsx --test .github/scripts/release.test.mts"

[tasks.lint]
description = "Lint entire monorepo"
depends = ["finance:lint", "finance:format:check"]
run = "bunx biome check apps packages .github/scripts package.json tsconfig.json biome.json"

[tasks."lint:fix"]
description = "Lint + auto-fix"
depends = ["finance:fix"]
run = "bunx biome check --write --unsafe apps packages .github/scripts package.json tsconfig.json biome.json"

[tasks.format]
description = "Format all files"
depends = ["finance:format"]
run = "bunx biome format --write apps packages .github/scripts package.json tsconfig.json biome.json"

[tasks."typecheck:core"]
run = 'mise run //packages/core:typecheck "$@"'

[tasks."typecheck:api"]
run = 'mise run //apps/api:typecheck "$@"'

[tasks."typecheck:web"]
run = 'mise run //apps/web:typecheck "$@"'

[tasks."typecheck:mcp"]
run = 'mise run //apps/mcp:typecheck "$@"'

[tasks.typecheck]
description = "Type-check workspace packages, automation, and Python in parallel"
depends = ["//apps/...:typecheck", "//packages/...:typecheck", "typecheck:release", "finance:typecheck"]

[tasks."typecheck:release"]
run = "bunx --no-install tsc --noEmit --project .github/scripts/tsconfig.json"

[tasks."typecheck:automation"]
run = 'mise run //packages/automation:typecheck "$@"'

# ── Test ──────────────────────────────────────────────────────
[tasks."test:core"]
run = 'mise run //packages/core:test "$@"'

[tasks."test:api"]
run = 'mise run //apps/api:test "$@"'

[tasks."test:web"]
run = 'mise run //apps/web:test "$@"'

[tasks."test:mcp"]
run = 'mise run //apps/mcp:test "$@"'

[tasks."services:test"]
description = "Test local service installation and lifecycle without changing macOS services"
run = "node --import tsx --test packages/automation/services/launchd.test.mts"

[tasks."whatsapp:test"]
description = "Test the pinned WhatsApp SDK pairing fixes without network connections"
run = "node --import tsx --experimental-vm-modules --test packages/automation/whatsapp/*.test.mts"

[tasks.test]
description = "Run all tests in parallel"
depends = ["//apps/...:test", "//packages/...:test", "finance:test", "release:test"]

[tasks."test:watch"]
description = "Run core tests in watch mode"
run = 'mise run //packages/core:test:watch "$@"'

# ── CLI (stock-checker commands) ─────────────────────────────
[tasks.predict]
description = "Run stock prediction  [usage: mise run predict -- --ticker=TSLA,PLTR]"
dir = "packages/core"
run = "bun src/index.ts predict $@"

[tasks.optimize]
description = "Run parameter optimizer"
dir = "packages/core"
run = "bun src/index.ts optimize $@"

[tasks.learn]
description = "Run learning from feedback"
dir = "packages/core"
run = "bun src/index.ts learn $@"

[tasks.backtest]
description = "Run backtest"
dir = "packages/core"
run = "bun src/index.ts backtest $@"

[tasks."strategy:validate"]
description = "Measure the active leader-pullback strategy against a frozen historical dataset"
dir = "packages/core"
run = 'bun src/commands/validate-strategy.ts "$@"'

# ── CI Pipeline ───────────────────────────────────────────────
[tasks.ci]
description = "Full CI gate: lint → typecheck → test → build"
depends = ["lint", "typecheck", "test", "build"]

# ── Git Hooks ─────────────────────────────────────────────────
[tasks."hooks:install"]
description = "Enable the repository git hooks"
run = """
set -eu
chmod +x .githooks/pre-commit .githooks/commit-msg
git config core.hooksPath .githooks
echo "repository git hooks installed"
"""
