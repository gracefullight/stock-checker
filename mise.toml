[tools]
node = "26"
bun = "1.4.2"
python = "3.14"
uv = "0.12.22"

# ── Install ──────────────────────────────────────────────────
[tasks.install]
description = "Install all dependencies"
run = "bun install"

[tasks."install:ci"]
description = "Install workspace dependencies without changing the lockfile"
run = "bun install --frozen-lockfile"

[tasks."deps:outdated"]
description = "Check outdated dependencies across all workspaces"
run = "bun outdated --recursive --no-cache"

[tasks."deps:update"]
description = "Update dependencies across all workspaces to the latest versions"
run = """
set -eu
bun update --latest --no-cache
(cd apps/api && bun update --latest --no-cache)
(cd apps/web && bun update --latest --no-cache)
(cd apps/mcp && bun update --latest --no-cache)
(cd packages/core && bun update --latest --no-cache)
"""

# ── Python finance tools ──────────────────────────────────────
[tasks."finance:install"]
description = "Install the locked Python finance-tool dependencies"
run = "uv sync --project tools/finance --locked --python 3.14"

[tasks."finance:deps:outdated"]
description = "Check outdated packages in the Python finance environment"
depends = ["finance:install"]
run = "uv pip list --python tools/finance/.venv/bin/python --outdated"

[tasks."finance:deps:update"]
description = "Update and install the Python finance dependency lockfile"
run = """
set -eu
uv lock --project tools/finance --upgrade
uv sync --project tools/finance --locked --python 3.14
"""

[tasks."finance:run"]
description = "Run a Python finance script with the locked environment"
env.PYTHONDONTWRITEBYTECODE = "1"
run = 'uv run --project tools/finance --locked --python 3.14 python "$@"'

[tasks."finance:typecheck"]
description = "Type-check the Python financial analysis scripts with Pyrefly"
run = "uv run --project tools/finance --locked --python 3.14 pyrefly check --config tools/finance/pyproject.toml --min-severity warn"

[tasks."finance:lint"]
description = "Lint the Python finance scripts and tests with Ruff"
run = "uv run --project tools/finance --locked --python 3.14 ruff check --config tools/finance/pyproject.toml .agents/skills/stock-analysis/scripts .agents/skills/backtesting-trading-strategies/scripts tools/finance/tests"

[tasks."finance:lint:fix"]
description = "Apply safe Ruff fixes to the Python finance scripts and tests"
run = "uv run --project tools/finance --locked --python 3.14 ruff check --fix --config tools/finance/pyproject.toml .agents/skills/stock-analysis/scripts .agents/skills/backtesting-trading-strategies/scripts tools/finance/tests"

[tasks."finance:format:check"]
description = "Check Python finance formatting with Ruff"
run = "uv run --project tools/finance --locked --python 3.14 ruff format --check --output-format concise --config tools/finance/pyproject.toml .agents/skills/stock-analysis/scripts .agents/skills/backtesting-trading-strategies/scripts tools/finance/tests"

[tasks."finance:format"]
description = "Format the Python finance scripts and tests with Ruff"
run = "uv run --project tools/finance --locked --python 3.14 ruff format --config tools/finance/pyproject.toml .agents/skills/stock-analysis/scripts .agents/skills/backtesting-trading-strategies/scripts tools/finance/tests"

[tasks."finance:fix"]
description = "Fix Python lint and formatting sequentially"
run = """
set -eu
mise run finance:lint:fix
mise run finance:format
"""

[tasks."finance:test"]
description = "Run Python finance regression tests"
env.PYTHONDONTWRITEBYTECODE = "1"
run = "uv run --project tools/finance --locked --python 3.14 pytest tools/finance/tests"

# ── Dev Servers ──────────────────────────────────────────────
[tasks.mcp]
description = "Run the local Stock Checker MCP server over stdio"
raw = true
run = "bun apps/mcp/src/index.ts"

[tasks."whatsapp:link"]
description = "Link WhatsApp Web by scanning the local gateway QR code"
raw = true
run = "node packages/core/src/whatsapp/index.ts --link"

[tasks."whatsapp:gateway"]
description = "Run the local WhatsApp Web notification gateway"
raw = true
run = "node packages/core/src/whatsapp/index.ts"

[tasks."dev:api"]
description = "Start Fastify API server (port 5101)"
dir = "apps/api"
run = "bun run dev"

[tasks."dev:web"]
description = "Start Next.js dev server (port 5100)"
dir = "apps/web"
run = "bun run dev"

[tasks.dev]
description = "Start API + Web dev servers in parallel"
depends = ["dev:api", "dev:web"]

# ── Build ─────────────────────────────────────────────────────
[tasks."build:core"]
dir = "packages/core"
run = "bun run build"

[tasks."build:api"]
depends = ["build:core"]
dir = "apps/api"
run = "bun run build"

[tasks."build:web"]
depends = ["build:core"]
dir = "apps/web"
run = "bun run build"

[tasks.build]
description = "Build all apps"
depends = ["build:api", "build:web"]

# ── Quality ───────────────────────────────────────────────────
[tasks."release:test"]
description = "Test release PR validation, lockfile synchronization, and merge guards"
run = "node --test .github/scripts/release.test.cjs"

[tasks.lint]
description = "Lint entire monorepo"
depends = ["finance:lint", "finance:format:check"]
run = "bunx biome check apps packages package.json tsconfig.json biome.json"

[tasks."lint:fix"]
description = "Lint + auto-fix"
depends = ["finance:fix"]
run = "bunx biome check --write --unsafe apps packages package.json tsconfig.json biome.json"

[tasks.format]
description = "Format all files"
depends = ["finance:format"]
run = "bunx biome format --write apps packages package.json tsconfig.json biome.json"

[tasks."typecheck:core"]
dir = "packages/core"
run = "bun run typecheck"

[tasks."typecheck:api"]
dir = "apps/api"
run = "bun run typecheck"

[tasks."typecheck:web"]
dir = "apps/web"
run = "bun run typecheck"

[tasks."typecheck:mcp"]
dir = "apps/mcp"
run = "bun run typecheck"

[tasks.typecheck]
description = "Type-check all packages in parallel"
depends = ["typecheck:core", "typecheck:api", "typecheck:web", "typecheck:mcp", "finance:typecheck"]

# ── Test ──────────────────────────────────────────────────────
[tasks."test:core"]
dir = "packages/core"
run = "bun run test"

[tasks."test:api"]
dir = "apps/api"
run = "bun run test"

[tasks."test:web"]
dir = "apps/web"
run = "bun run test"

[tasks."test:mcp"]
dir = "apps/mcp"
run = "bun run test"

[tasks.test]
description = "Run all tests in parallel"
depends = ["test:core", "test:api", "test:web", "test:mcp", "finance:test", "release:test"]

[tasks."test:watch"]
description = "Run core tests in watch mode"
dir = "packages/core"
run = "bun run test:watch"

# ── CLI (stock-checker commands) ─────────────────────────────
[tasks.predict]
description = "Run stock prediction  [usage: mise run predict -- --ticker=TSLA,PLTR]"
dir = "packages/core"
run = "bun src/index.ts predict $@"

[tasks.optimize]
description = "Run parameter optimizer"
dir = "packages/core"
run = "bun src/index.ts optimize $@"

[tasks.learn]
description = "Run learning from feedback"
dir = "packages/core"
run = "bun src/index.ts learn $@"

[tasks.backtest]
description = "Run backtest"
dir = "packages/core"
run = "bun src/index.ts backtest $@"

# ── CI Pipeline ───────────────────────────────────────────────
[tasks.ci]
description = "Full CI gate: lint → typecheck → test → build"
depends = ["lint", "typecheck", "test", "build"]

# ── Git Hooks ─────────────────────────────────────────────────
[tasks."hooks:install"]
description = "Enable the repository git hooks"
run = """
set -eu
chmod +x .githooks/pre-commit .githooks/commit-msg
git config core.hooksPath .githooks
echo "repository git hooks installed"
"""
