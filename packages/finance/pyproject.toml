[project]
name = "stock-checker-finance-tools"
version = "0.0.0"
description = "Python dependencies for the repository's financial analysis skills"
requires-python = ">=3.14,<3.15"
dependencies = [
  "edgartools>=5.60.0",
  "fear-and-greed>=0.4",
  "feedparser>=6.0.14",
  "matplotlib>=3.11.2",
  "numpy>=2.5.3",
  "pandas>=3.0.6",
  "requests>=2.34.2",
  "yfinance>=1.7.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pyrefly>=1.3.2", "pytest>=9.1.1", "ruff>=0.16.10"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../../.agents/skills/stock-analysis/scripts"]

[tool.pyrefly]
preset = "default"
python-version = "3.14"
disable-project-excludes-heuristics = true
project-includes = [
  "tests/**/*.py",
  "../../.agents/skills/stock-analysis/scripts/*.py",
  "../../.agents/skills/backtesting-trading-strategies/scripts/*.py",
]
search-path = [
  "../../.agents/skills/backtesting-trading-strategies/scripts",
  "../../.agents/skills/stock-analysis/scripts",
]
