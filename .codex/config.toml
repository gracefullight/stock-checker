[mcp_servers.serena]
command = "oma"
args = [ "bridge", "--context", "oma" ]
startup_timeout_sec = 90

[mcp_servers.serena.env]
SERENA_LOG_LEVEL = "info"

[mcp_servers.aside]
command = "aside"
args = [ "mcp" ]

[features]
goals = true
hooks = true

[analytics]
enabled = false

[feedback]
enabled = false

