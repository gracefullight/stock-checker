name: Quality checks

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/core/src/**"
      - "packages/core/scripts/**"
      - "packages/core/*.json"
      - "packages/core/vitest.config.ts"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "biome.json"
      - "patches/**"
      - "tools/services/**"
      - "tools/whatsapp/**"
      - "mise.toml"
      - ".github/workflows/quality.yml"
      - ".github/workflows/release.yml"
      - ".github/scripts/**"
      - "release-please-config.json"
      - ".release-please-manifest.json"
  pull_request:
    paths:
      - "apps/**"
      - "packages/core/src/**"
      - "packages/core/scripts/**"
      - "packages/core/*.json"
      - "packages/core/vitest.config.ts"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "biome.json"
      - "patches/**"
      - "tools/services/**"
      - "tools/whatsapp/**"
      - "mise.toml"
      - ".github/workflows/quality.yml"
      - ".github/workflows/release.yml"
      - ".github/scripts/**"
      - "release-please-config.json"
      - ".release-please-manifest.json"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate before automatically merging a release
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@v5.0.1
      - name: Install locked workspace dependencies
        run: mise run install:ci
      - name: Lint and check formatting
        run: mise run lint
      - name: Check TypeScript and Python types
        run: mise run typecheck
      - name: Run offline tests
        run: mise run test
