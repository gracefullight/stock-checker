name: Daily stock data

permissions:
  contents: write

on:
  schedule:
    # US weekdays only, ~2 hours after the close; weekend runs re-wrote Friday's rows.
    - cron: "0 23 * * 1-5"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Run prediction
        run: bun src/index.ts predict --ticker="ABCL,BE,CIEN,DLO,DNA,GEV,GLW,GOOGL,INTC,IONQ,OPEN,PLTR,POET,TSLA,UPST" --sort=asc
        working-directory: packages/core
        env:
          # OHLCV fallback when Yahoo is rate-limited (see services/tiingo.ts)
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          # Hosted runners have no local linked WhatsApp session or gateway token.
          # Scheduled WhatsApp alerts require a local scheduler with the gateway running.
      - name: Pull latest changes before commit
        # --autostash: the predict step leaves updated CSVs unstaged, which a
        # plain pull --rebase refuses to run on.
        run: git pull --rebase --autostash origin main
      # Data-only commits are excluded from releases through `exclude-paths`
      # in release-please-config.json, so no release workflow dispatch follows.
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(data): daily stock data update"
          file_pattern: "packages/core/public/*.csv"
